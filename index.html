<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>ToDo-list</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>

<!--Titel, paragraph och kod för knapp/skrivfält-->

<h1>My ToDo-list</h1>

<p id="counterText">0 completed</p>



<label for="userInput"></label>
<input type="text" id="todoInput" placeholder="Enter a ToDo...">

<div class="buttonContainer">
    <button type="button" id="addBtn">Add ToDo</button>
    <button type="button" id="removeAllBtn">Remove All</button>
</div>



<!--Listor och listitems-->
<small></small>


<h2 class="uncompletedTodo">To do</h2>
<ul id="todoList"></ul>
<h2 class="completedTodo">Completed</h2>
<ul id="completedList"></ul>
 



<script src="main.js"></script>
</body>
</html>
