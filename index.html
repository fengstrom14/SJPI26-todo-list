<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>ToDo-list</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>

<!-- Titel, räknare och input -->

<h1>My ToDo-list</h1>

<p id="counterText">0 completed</p>


<!-- Knappar för att lägga till och ta bort uppgifter -->
<label for="userInput"></label>
<input type="text" id="todoInput" placeholder="Enter a ToDo...">

<div class="buttonContainer">
    <button type="button" id="addBtn">Add ToDo</button>
    <button type="button" id="removeAllBtn">Remove All</button>
</div>




<small></small>
<!-- Lista med aktiva ToDo-uppgifter -->
<h2 class="uncompletedTodo">To do</h2>
<ul id="todoList"></ul>

<!-- Lista med färdiga ToDo-uppgifter -->
<h2 class="completedTodo">Completed</h2>
<ul id="completedList"></ul>
 



<script src="main.js"></script>
</body>
</html>
